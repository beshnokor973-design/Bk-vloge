<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Beshno Blog | Admin</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f0f2f5;
  color:#1c1e21;
}

.header{
  background:#1877f2;
  color:white;
  padding:18px;
  text-align:center;
  font-size:24px;
  font-weight:bold;
}

.container{
  max-width:650px;
  margin:25px auto;
  padding:0 12px;
}

.card{
  background:white;
  border-radius:15px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
}

h1,h2{
  margin-top:0;
}

input,
textarea{
  width:100%;
  padding:13px;
  margin:7px 0 14px;
  border:1px solid #ddd;
  border-radius:9px;
  font-size:16px;
  font-family:inherit;
}

textarea{
  min-height:160px;
  resize:vertical;
}

button{
  width:100%;
  border:0;
  padding:13px;
  border-radius:9px;
  background:#1877f2;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.logout{
  background:#e41e3f;
  margin-top:10px;
}

.publish{
  background:#1877f2;
  margin-top:10px;
}

.preview{
  width:100%;
  max-height:300px;
  object-fit:contain;
  display:none;
  background:#111;
  border-radius:10px;
  margin-bottom:15px;
}

.message{
  display:none;
  padding:12px;
  border-radius:9px;
  margin-top:12px;
  line-height:1.5;
}

.success{
  display:block;
  background:#e7f7e7;
  color:#176b17;
}

.error{
  display:block;
  background:#ffe8e8;
  color:#a00000;
}

#adminPanel{
  display:none;
}

.progress{
  width:100%;
  height:10px;
  background:#eee;
  border-radius:10px;
  overflow:hidden;
  margin:15px 0;
  display:none;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#1877f2;
  transition:.2s;
}

.label{
  font-weight:bold;
  margin-top:8px;
  display:block;
}

.note{
  color:#65676b;
  font-size:14px;
  line-height:1.6;
}

</style>
</head>

<body>

<div class="header">
  🔐 Beshno Blog Admin
</div>


<div class="container">


<!-- LOGIN -->

<section class="card" id="loginBox">

<h2>Admin Login</h2>

<p class="note">
শুধু Admin account দিয়ে Login করুন।
</p>

<label class="label">
Admin Email
</label>

<input
  type="email"
  id="email"
  placeholder="Admin Email"
>


<label class="label">
Password
</label>

<input
  type="password"
  id="password"
  placeholder="Password"
>


<button id="loginBtn">
Login
</button>

<div id="loginMessage" class="message"></div>

</section>



<!-- ADMIN PANEL -->

<section class="card" id="adminPanel">

<h2>📝 নতুন পোস্ট</h2>

<label class="label">
পোস্টের শিরোনাম
</label>

<input
  type="text"
  id="title"
  placeholder="যেমন: আজকের নতুন খবর"
>


<label class="label">
পোস্টের লেখা
</label>

<textarea
  id="text"
  placeholder="এখানে পোস্টের লেখা লিখুন..."
></textarea>



<label class="label">
🖼️ ছবি Upload
</label>

<input
  type="file"
  id="imageFile"
  accept="image/*"
>

<img
  id="imagePreview"
  class="preview"
  alt="Image Preview"
>



<label class="label">
🎬 ভিডিও Upload
</label>

<input
  type="file"
  id="videoFile"
  accept="video/*"
>

<video
  id="videoPreview"
  class="preview"
  controls
></video>



<label class="label">
▶️ YouTube Video URL
</label>

<input
  type="url"
  id="youtubeUrl"
  placeholder="https://www.youtube.com/watch?v=..."
>


<p class="note">
একটি পোস্টে ছবি, ভিডিও অথবা YouTube ভিডিও দিতে পারো।
শুধু লেখা পোস্টও করা যাবে।
</p>


<div class="progress" id="progress">
  <div class="progress-bar" id="progressBar"></div>
</div>


<button
  class="publish"
  id="publishBtn">
🚀 Publish Post
</button>


<div
  id="postMessage"
  class="message">
</div>


<button
  class="logout"
  id="logoutBtn">
Logout
</button>

</section>

</div>



<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import {
  getStorage,
  ref,
  uploadBytesResumable,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js";



/* FIREBASE */

const firebaseConfig = {

  apiKey:"AIzaSyBVOlLubebOhWgYOHwSt7bNkUbqTS_QFu4",

  authDomain:"beshno-blog.firebaseapp.com",

  projectId:"beshno-blog",

  storageBucket:"beshno-blog.firebasestorage.app",

  messagingSenderId:"1070244747427",

  appId:"1:1070244747427:web:0acbf8b3b60cb9121a8716",

  measurementId:"G-VWZZ6YXSPP"

};



const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const storage = getStorage(app);



/* ELEMENTS */

const loginBox =
  document.getElementById("loginBox");

const adminPanel =
  document.getElementById("adminPanel");

const loginBtn =
  document.getElementById("loginBtn");

const logoutBtn =
  document.getElementById("logoutBtn");

const loginMessage =
  document.getElementById("loginMessage");

const postMessage =
  document.getElementById("postMessage");

const publishBtn =
  document.getElementById("publishBtn");

const imageFile =
  document.getElementById("imageFile");

const videoFile =
  document.getElementById("videoFile");

const imagePreview =
  document.getElementById("imagePreview");

const videoPreview =
  document.getElementById("videoPreview");

const progress =
  document.getElementById("progress");

const progressBar =
  document.getElementById("progressBar");



/* LOGIN */

loginBtn.addEventListener(
  "click",
  async () => {

    const email =
      document.getElementById("email")
      .value.trim();

    const password =
      document.getElementById("password")
      .value;


    if(!email || !password){

      showMessage(
        loginMessage,
        "Email এবং Password দিন।",
        "error"
      );

      return;

    }


    loginBtn.disabled = true;

    loginBtn.textContent =
      "Login হচ্ছে...";


    try{

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


    }catch(error){

      console.error(error);

      showMessage(
        loginMessage,
        "Login করা যায়নি: " +
        error.message,
        "error"
      );

    }


    loginBtn.disabled = false;

    loginBtn.textContent =
      "Login";

  }
);



/* AUTH CHECK */

onAuthStateChanged(
  auth,
  user => {

    if(user){

      loginBox.style.display =
        "none";

      adminPanel.style.display =
        "block";

    }else{

      loginBox.style.display =
        "block";

      adminPanel.style.display =
        "none";

    }

  }
);



/* LOGOUT */

logoutBtn.addEventListener(
  "click",
  async () => {

    await signOut(auth);

  }
);



/* IMAGE PREVIEW */

imageFile.addEventListener(
  "change",
  () => {

    const file =
      imageFile.files[0];

    if(!file){

      imagePreview.style.display =
        "none";

      return;

    }


    imagePreview.src =
      URL.createObjectURL(file);

    imagePreview.style.display =
      "block";

  }
);



/* VIDEO PREVIEW */

videoFile.addEventListener(
  "change",
  () => {

    const file =
      videoFile.files[0];

    if(!file){

      videoPreview.style.display =
        "none";

      return;

    }


    videoPreview.src =
      URL.createObjectURL(file);

    videoPreview.style.display =
      "block";

  }
);



/* UPLOAD FILE */

function uploadFile(file,path){

  return new Promise(
    (resolve,reject) => {

      const fileName =
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2) +
        "_" +
        file.name;


      const storageRef =
        ref(
          storage,
          path + "/" + fileName
        );


      const uploadTask =
        uploadBytesResumable(
          storageRef,
          file
        );


      uploadTask.on(

        "state_changed",

        snapshot => {

          const percent =
            (
              snapshot.bytesTransferred /
              snapshot.totalBytes
            ) * 100;


          progressBar.style.width =
            percent + "%";

        },

        error => {

          reject(error);

        },

        async () => {

          try{

            const url =
              await getDownloadURL(
                uploadTask.snapshot.ref
              );

            resolve(url);

          }catch(error){

            reject(error);

          }

        }

      );

    }
  );

}



/* PUBLISH */

publishBtn.addEventListener(
  "click",
  async () => {

    const title =
      document.getElementById("title")
      .value.trim();

    const text =
      document.getElementById("text")
      .value.trim();

    const youtubeUrl =
      document.getElementById("youtubeUrl")
      .value.trim();

    const image =
      imageFile.files[0];

    const video =
      videoFile.files[0];


    if(
      !title &&
      !text &&
      !image &&
      !video &&
      !youtubeUrl
    ){

      showMessage(
        postMessage,
        "কমপক্ষে একটি লেখা, ছবি, ভিডিও অথবা YouTube URL দিন।",
        "error"
      );

      return;

    }


    publishBtn.disabled =
      true;

    publishBtn.textContent =
      "পোস্ট তৈরি হচ্ছে...";


    progress.style.display =
      "block";

    progressBar.style.width =
      "5%";


    try{

      let imageUrl = null;

      let videoUrl = null;


      /* IMAGE */

      if(image){

        progressBar.style.width =
          "10%";

        imageUrl =
          await uploadFile(
            image,
            "posts/images"
          );

      }


      /* VIDEO */

      if(video){

        progressBar.style.width =
          "40%";

        videoUrl =
          await uploadFile(
            video,
            "posts/videos"
          );

      }


      progressBar.style.width =
        "80%";


      /* FIRESTORE */

      await addDoc(
        collection(db,"posts"),
        {

          title:title,

          text:text,

          imageUrl:imageUrl,

          videoUrl:videoUrl,

          youtubeUrl:youtubeUrl,

          author:"Beshno Blog",

          createdAt:
            serverTimestamp()

        }
      );


      progressBar.style.width =
        "100%";


      showMessage(
        postMessage,
        "✅ পোস্ট সফলভাবে প্রকাশ হয়েছে!",
        "success"
      );


      /* CLEAR */

      document.getElementById("title")
        .value = "";

      document.getElementById("text")
        .value = "";

      document.getElementById("youtubeUrl")
        .value = "";

      imageFile.value = "";

      videoFile.value = "";

      imagePreview.src = "";

      videoPreview.src = "";

      imagePreview.style.display =
        "none";

      videoPreview.style.display =
        "none";


    }catch(error){

      console.error(error);

      showMessage(
        postMessage,
        "❌ পোস্ট করা যায়নি: " +
        error.message,
        "error"
      );

    }


    publishBtn.disabled =
      false;

    publishBtn.textContent =
      "🚀 Publish Post";

  }
);



/* MESSAGE */

function showMessage(
  element,
  text,
  type
){

  element.textContent =
    text;

  element.className =
    "message " + type;

}

</script>

</body>
</html>
