<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  query,
  orderBy
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/*
========================================
তোমার Firebase Config এখানে বসাও
========================================
*/

const firebaseConfig = {

  apiKey: "YOUR_API_KEY",

  authDomain:
    "beshno-blog.firebaseapp.com",

  projectId:
    "beshno-blog",

  storageBucket:
    "beshno-blog.firebasestorage.app",

  messagingSenderId:
    "1070244747427",

  appId:
    "YOUR_APP_ID"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


/*
========================================
POST LOAD
========================================
*/

async function loadPosts(){

  const postsBox =
    document.getElementById("posts");

  try{

    const postsQuery =
      query(
        collection(db,"posts"),
        orderBy("createdAt","desc")
      );

    const snapshot =
      await getDocs(postsQuery);


    postsBox.innerHTML = "";


    if(snapshot.empty){

      postsBox.innerHTML = `
        <div class="loading">
          এখনো কোনো পোস্ট নেই।
        </div>
      `;

      return;
    }


    snapshot.forEach((doc)=>{

      const post =
        doc.data();

      createPost(post);

    });


  }catch(error){

    console.error(error);

    postsBox.innerHTML = `
      <div class="loading">
        ❌ পোস্ট লোড করা যাচ্ছে না।<br><br>
        Firebase Firestore Rules এবং Config চেক করো।
      </div>
    `;

  }

}


/*
========================================
CREATE POST
========================================
*/

function createPost(post){

  const postsBox =
    document.getElementById("posts");


  const article =
    document.createElement("article");

  article.className = "post";


  /* DATE */

  let dateText = "";

  if(post.createdAt){

    try{

      dateText =
        post.createdAt.toDate()
        .toLocaleString("bn-BD");

    }catch(e){

      dateText = "";

    }

  }


  let html = `

    <div class="post-top">

      <img
        class="post-avatar"
        src="https://via.placeholder.com/100"
        alt="Beshno Blog">

      <div>

        <div class="post-user">
          Beshno Blog
        </div>

        <div class="post-date">
          ${dateText}
        </div>

      </div>

    </div>
  `;


  /* TITLE */

  if(post.title){

    html += `
      <div class="post-title">
        ${escapeHTML(post.title)}
      </div>
    `;

  }


  /* CONTENT */

  if(post.content){

    html += `
      <div class="post-content">
        ${escapeHTML(post.content)}
      </div>
    `;

  }


  /* IMAGE */

  if(post.imageUrl){

    html += `
      <img
        class="post-image"
        src="${escapeAttribute(post.imageUrl)}"
        alt="Post Image"
        loading="lazy">
    `;

  }


  /* VIDEO */

  if(post.videoUrl){

    html += `
      <video
        class="post-video"
        controls
        preload="metadata">

        <source
          src="${escapeAttribute(post.videoUrl)}">

        তোমার ব্রাউজার ভিডিও চালাতে পারছে না।

      </video>
    `;

  }


  /* YOUTUBE */

  if(post.youtubeUrl){

    const youtubeID =
      getYouTubeID(post.youtubeUrl);


    if(youtubeID){

      html += `

        <div class="youtube-box">

          <iframe
            src="https://www.youtube.com/embed/${youtubeID}"
            title="YouTube video"
            allowfullscreen>
          </iframe>

        </div>

      `;

    }

  }


  /* BUTTONS */

  html += `

    <div class="post-actions">

      <button
        onclick="likePost(this)">
        👍 Like
      </button>

      <button
        onclick="sharePost()">
        ↗ Share
      </button>

    </div>

  `;


  article.innerHTML =
    html;

  postsBox.appendChild(article);

}


/*
========================================
YOUTUBE ID
========================================
*/

function getYouTubeID(url){

  try{

    const u =
      new URL(url);


    if(u.hostname.includes("youtu.be")){

      return u.pathname.substring(1);

    }


    if(u.hostname.includes("youtube.com")){

      if(u.searchParams.get("v")){

        return u.searchParams.get("v");

      }


      const parts =
        u.pathname.split("/");


      const index =
        parts.indexOf("shorts");


      if(index !== -1){

        return parts[index + 1];

      }

    }

  }catch(e){

    return null;

  }

  return null;

}


/*
========================================
SECURITY
========================================
*/

function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttribute(text){

  return String(text)
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}


/*
========================================
FOLLOW
========================================
*/

let following =
  localStorage.getItem(
    "beshno_following"
  ) === "true";


let followers =
  parseInt(
    localStorage.getItem(
      "beshno_followers"
    ) || "0"
  );


function updateFollow(){

  const btn =
    document.getElementById(
      "followBtn"
    );

  const count =
    document.getElementById(
      "followerCount"
    );


  if(following){

    btn.innerHTML =
      "✓ Following";

    btn.classList.add(
      "following"
    );

  }else{

    btn.innerHTML =
      "➕ Follow";

    btn.classList.remove(
      "following"
    );

  }


  count.innerHTML =
    followers + " followers";

}


window.toggleFollow =
function(){

  if(!following){

    following = true;

    followers++;

  }else{

    following = false;

    if(followers > 0){

      followers--;

    }

  }


  localStorage.setItem(
    "beshno_following",
    following
  );


  localStorage.setItem(
    "beshno_followers",
    followers
  );


  updateFollow();

};


updateFollow();


/*
========================================
LIKE
========================================
*/

window.likePost =
function(button){

  if(
    button.dataset.liked === "true"
  ){

    button.dataset.liked =
      "false";

    button.innerHTML =
      "👍 Like";

  }else{

    button.dataset.liked =
      "true";

    button.innerHTML =
      "👍 Liked";

  }

};


/*
========================================
SHARE
========================================
*/

window.sharePost =
function(){

  if(navigator.share){

    navigator.share({

      title:
        "Beshno Blog",

      text:
        "Beshno Blog-এর পোস্ট দেখুন",

      url:
        window.location.href

    });

  }else{

    navigator.clipboard.writeText(
      window.location.href
    );

    alert(
      "Post link copied!"
    );

  }

};


/*
========================================
START
========================================
*/

loadPosts();

</script>

</body>
</html>
