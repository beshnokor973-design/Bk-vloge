<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Beshno Blog | Admin</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f4f7;
}

.container {
  width: 92%;
  max-width: 650px;
  margin: 30px auto;
}

.card {
  background: white;
  padding: 22px;
  border-radius: 16px;
  box-shadow: 0 5px 25px rgba(0,0,0,.08);
}

h1 {
  margin-top: 0;
}

label {
  display: block;
  margin-top: 18px;
  margin-bottom: 7px;
  font-weight: bold;
}

input,
textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #ddd;
  border-radius: 9px;
  font-size: 16px;
}

textarea {
  min-height: 160px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 18px;
  border: 0;
  border-radius: 9px;
  background: #111;
  color: white;
  font-size: 17px;
  cursor: pointer;
}

.logout {
  background: #d71919;
}

.preview {
  width: 100%;
  max-height: 300px;
  object-fit: contain;
  margin-top: 12px;
  border-radius: 10px;
  display: none;
  background: #000;
}

.message {
  margin-top: 15px;
  padding: 12px;
  border-radius: 8px;
  display: none;
}

.success {
  background: #e8f7e8;
  color: #126b12;
}

.error {
  background: #ffe8e8;
  color: #a00000;
}

#adminPanel {
  display: none;
}

.progress {
  width: 100%;
  height: 8px;
  background: #eee;
  border-radius: 10px;
  margin-top: 15px;
  overflow: hidden;
  display: none;
}

#progressBar {
  height: 100%;
  width: 0%;
  background: #111;
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->

<div class="card" id="loginBox">

<h1>🔐 Beshno Blog Admin</h1>

<label>Email</label>

<input
  type="email"
  id="email"
  placeholder="Admin Email"
>

<label>Password</label>

<input
  type="password"
  id="password"
  placeholder="Password"
>

<button id="loginBtn">
Login
</button>

<div id="loginMessage" class="message"></div>

</div>


<!-- ADMIN PANEL -->

<div class="card" id="adminPanel">

<h1>📝 Create New Post</h1>

<label>Post Title</label>

<input
  type="text"
  id="title"
  placeholder="Post Title"
>


<label>Post Content</label>

<textarea
  id="content"
  placeholder="পোস্টের লেখা লিখুন..."
></textarea>


<label>📷 Photo</label>

<input
  type="file"
  id="imageFile"
  accept="image/*"
>

<img
  id="imagePreview"
  class="preview"
  alt="Image Preview"
>


<label>🎬 Video</label>

<input
  type="file"
  id="videoFile"
  accept="video/*"
>

<video
  id="videoPreview"
  class="preview"
  controls
></video>


<label>▶️ YouTube Video URL</label>

<input
  type="url"
  id="youtubeUrl"
  placeholder="https://www.youtube.com/watch?v=..."
>


<div class="progress" id="progress">
  <div id="progressBar"></div>
</div>


<button id="publishBtn">
Publish Post
</button>

<div
  id="publishMessage"
  class="message"
></div>


<button
  class="logout"
  id="logoutBtn"
>
Logout
</button>

</div>

</div>


<script type="module">

/* FIREBASE */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";


/* FIREBASE CONFIG */

const firebaseConfig = {
  apiKey: "AIzaSyBVOlLubebOhWgYOHwSt7bNkUbqTS_QFu4",
  authDomain: "beshno-blog.firebaseapp.com",
  projectId: "beshno-blog",
  storageBucket: "beshno-blog.firebasestorage.app",
  messagingSenderId: "1070244747427",
  appId: "1:1070244747427:web:0acbf8b3b60cb9121a8716",
  measurementId: "G-VWZZ6YXSPP"
};


/* INITIALIZE */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const storage = getStorage(app);


/* ELEMENTS */

const loginBox =
  document.getElementById("loginBox");

const adminPanel =
  document.getElementById("adminPanel");

const email =
  document.getElementById("email");

const password =
  document.getElementById("password");

const title =
  document.getElementById("title");

const content =
  document.getElementById("content");

const imageFile =
  document.getElementById("imageFile");

const videoFile =
  document.getElementById("videoFile");

const youtubeUrl =
  document.getElementById("youtubeUrl");

const imagePreview =
  document.getElementById("imagePreview");

const videoPreview =
  document.getElementById("videoPreview");

const loginBtn =
  document.getElementById("loginBtn");

const publishBtn =
  document.getElementById("publishBtn");

const logoutBtn =
  document.getElementById("logoutBtn");

const progress =
  document.getElementById("progress");

const progressBar =
  document.getElementById("progressBar");

const loginMessage =
  document.getElementById("loginMessage");

const publishMessage =
  document.getElementById("publishMessage");


/* MESSAGE */

function showMessage(element, text, type) {

  element.textContent = text;

  element.className =
    "message " + type;

  element.style.display = "block";
}


/* LOGIN */

loginBtn.addEventListener(
  "click",
  async () => {

    const userEmail =
      email.value.trim();

    const userPassword =
      password.value;

    if (!userEmail || !userPassword) {

      showMessage(
        loginMessage,
        "Email এবং Password দিন",
        "error"
      );

      return;
    }

    loginBtn.disabled = true;

    loginBtn.textContent =
      "Logging in...";

    try {

      await signInWithEmailAndPassword(
        auth,
        userEmail,
        userPassword
      );

    } catch (error) {

      console.error(error);

      showMessage(
        loginMessage,
        "❌ Login failed: " +
        error.message,
        "error"
      );

    }

    loginBtn.disabled = false;

    loginBtn.textContent =
      "Login";

  }
);


/* AUTH STATE */

onAuthStateChanged(
  auth,
  user => {

    if (user) {

      loginBox.style.display =
        "none";

      adminPanel.style.display =
        "block";

    } else {

      loginBox.style.display =
        "block";

      adminPanel.style.display =
        "none";
    }

  }
);


/* IMAGE PREVIEW */

imageFile.addEventListener(
  "change",
  () => {

    const file =
      imageFile.files[0];

    if (!file) return;

    imagePreview.src =
      URL.createObjectURL(file);

    imagePreview.style.display =
      "block";

  }
);


/* VIDEO PREVIEW */

videoFile.addEventListener(
  "change",
  () => {

    const file =
      videoFile.files[0];

    if (!file) return;

    videoPreview.src =
      URL.createObjectURL(file);

    videoPreview.style.display =
      "block";

  }
);


/* UPLOAD FILE */

async function uploadFile(
  file,
  folder
) {

  if (!file) {
    return null;
  }

  const safeName =
    file.name.replace(
      /[^a-zA-Z0-9._-]/g,
      "_"
    );

  const fileName =
    Date.now() +
    "_" +
    safeName;

  const fileRef =
    ref(
      storage,
      folder + "/" + fileName
    );

  const snapshot =
    await uploadBytes(
      fileRef,
      file
    );

  const url =
    await getDownloadURL(
      snapshot.ref
    );

  return url;
}


/* PUBLISH */

publishBtn.addEventListener(
  "click",
  async () => {

    const postTitle =
      title.value.trim();

    const postContent =
      content.value.trim();

    const image =
      imageFile.files[0];

    const video =
      videoFile.files[0];

    const youtube =
      youtubeUrl.value.trim();


    if (!postTitle) {

      showMessage(
        publishMessage,
        "Post Title দিন",
        "error"
      );

      return;
    }


    if (!postContent) {

      showMessage(
        publishMessage,
        "Post Content লিখুন",
        "error"
      );

      return;
    }


    publishBtn.disabled = true;

    publishBtn.textContent =
      "Publishing...";

    progress.style.display =
      "block";

    progressBar.style.width =
      "5%";


    try {

      /* IMAGE */

      let imageUrl = null;

      if (image) {

        progressBar.style.width =
          "15%";

        imageUrl =
          await uploadFile(
            image,
            "posts/images"
          );
      }


      /* VIDEO */

      let videoUrl = null;

      if (video) {

        progressBar.style.width =
          "50%";

        videoUrl =
          await uploadFile(
            video,
            "posts/videos"
          );
      }


      /* FIRESTORE */

      progressBar.style.width =
        "80%";

      await addDoc(
        collection(db, "posts"),
        {

          title: postTitle,

          content: postContent,

          imageUrl: imageUrl,

          videoUrl: videoUrl,

          youtubeUrl:
            youtube || null,

          createdAt:
            serverTimestamp()

        }
      );


      progressBar.style.width =
        "100%";


      showMessage(
        publishMessage,
        "✅ Post সফলভাবে Publish হয়েছে!",
        "success"
      );


      /* CLEAR */

      title.value = "";

      content.value = "";

      imageFile.value = "";

      videoFile.value = "";

      youtubeUrl.value = "";

      imagePreview.src = "";

      imagePreview.style.display =
        "none";

      videoPreview.pause();

      videoPreview.src = "";

      videoPreview.style.display =
        "none";


    } catch (error) {

      console.error(error);

      showMessage(
        publishMessage,
        "❌ Post করা যায়নি: " +
        error.message,
        "error"
      );

    }


    publishBtn.disabled = false;

    publishBtn.textContent =
      "Publish Post";

  }
);


/* LOGOUT */

logoutBtn.addEventListener(
  "click",
  async () => {

    await signOut(auth);

  }
);

</script>

</body>
</html>
