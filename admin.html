<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Beshno Blog | Admin</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
}

.container {
  max-width: 600px;
  margin: 30px auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

h1 {
  margin-top: 0;
}

input,
textarea {
  width: 100%;
  padding: 13px;
  margin: 8px 0 15px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 16px;
  box-sizing: border-box;
}

textarea {
  min-height: 180px;
}

button {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 8px;
  background: #111;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
}

.logout {
  background: #d00;
  margin-top: 10px;
}

#adminPanel {
  display: none;
}

.message {
  margin-top: 15px;
  padding: 10px;
  border-radius: 8px;
  display: none;
}

.success {
  background: #e8f7e8;
  color: #176b17;
}

.error {
  background: #ffe8e8;
  color: #a00000;
}

.preview {
  width: 100%;
  max-height: 300px;
  object-fit: cover;
  border-radius: 10px;
  margin: 10px 0 15px;
  display: none;
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->
<section class="card" id="loginBox">

<h1>🔐 Beshno Blog Admin</h1>

<p>Admin account দিয়ে Login করুন।</p>

<input
  type="email"
  id="email"
  placeholder="Admin Email"
>

<input
  type="password"
  id="password"
  placeholder="Password"
>

<button id="loginBtn">
Login
</button>

<div id="loginMessage" class="message"></div>

</section>


<!-- ADMIN PANEL -->
<section class="card" id="adminPanel">

<h1>📝 Create New Post</h1>

<label>Post Title</label>

<input
  type="text"
  id="title"
  placeholder="পোস্টের শিরোনাম লিখুন"
>


<label>Post Content</label>

<textarea
  id="content"
  placeholder="পোস্টের লেখা লিখুন..."
></textarea>


<label>📸 Post Image</label>

<input
  type="file"
  id="imageFile"
  accept="image/*"
>

<img
  id="imagePreview"
  class="preview"
  alt="Image Preview"
>


<button id="publishBtn">
🚀 Publish Post
</button>

<div id="publishMessage" class="message"></div>


<button id="logoutBtn" class="logout">
Logout
</button>

</section>

</div>


<script type="module">

/* =========================
   FIREBASE IMPORT
========================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyBVOlLubebOhWgYOHwSt7bNkUbqTS_QFu4",
  authDomain: "beshno-blog.firebaseapp.com",
  projectId: "beshno-blog",
  storageBucket: "beshno-blog.firebasestorage.app",
  messagingSenderId: "1070244747427",
  appId: "1:1070244747427:web:0acbf8b3b60cb9121a8716",
  measurementId: "G-VWZZ6YXSPP"
};


/* =========================
   INITIALIZE FIREBASE
========================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const storage = getStorage(app);


/* =========================
   ELEMENTS
========================= */

const loginBox =
  document.getElementById("loginBox");

const adminPanel =
  document.getElementById("adminPanel");

const email =
  document.getElementById("email");

const password =
  document.getElementById("password");

const loginBtn =
  document.getElementById("loginBtn");

const loginMessage =
  document.getElementById("loginMessage");

const title =
  document.getElementById("title");

const content =
  document.getElementById("content");

const imageFile =
  document.getElementById("imageFile");

const imagePreview =
  document.getElementById("imagePreview");

const publishBtn =
  document.getElementById("publishBtn");

const publishMessage =
  document.getElementById("publishMessage");

const logoutBtn =
  document.getElementById("logoutBtn");


/* =========================
   MESSAGE FUNCTION
========================= */

function showMessage(element, text, type) {

  element.textContent = text;

  element.className =
    "message " + type;

  element.style.display = "block";
}


/* =========================
   IMAGE PREVIEW
========================= */

imageFile.addEventListener("change", function() {

  const file = imageFile.files[0];

  if (!file) {

    imagePreview.style.display = "none";

    return;
  }

  const imageURL =
    URL.createObjectURL(file);

  imagePreview.src = imageURL;

  imagePreview.style.display = "block";

});


/* =========================
   LOGIN
========================= */

loginBtn.addEventListener("click", async function() {

  const userEmail =
    email.value.trim();

  const userPassword =
    password.value;

  if (!userEmail || !userPassword) {

    showMessage(
      loginMessage,
      "Email এবং Password দিন।",
      "error"
    );

    return;
  }

  loginBtn.disabled = true;

  loginBtn.textContent =
    "Login হচ্ছে...";

  try {

    await signInWithEmailAndPassword(
      auth,
      userEmail,
      userPassword
    );

    showMessage(
      loginMessage,
      "Login সফল হয়েছে।",
      "success"
    );

  } catch (error) {

    console.error(error);

    showMessage(
      loginMessage,
      "Login হয়নি। Email অথবা Password পরীক্ষা করুন।",
      "error"
    );

  }

  loginBtn.disabled = false;

  loginBtn.textContent =
    "Login";

});


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(auth, function(user) {

  if (user) {

    loginBox.style.display =
      "none";

    adminPanel.style.display =
      "block";

  } else {

    loginBox.style.display =
      "block";

    adminPanel.style.display =
      "none";

  }

});


/* =========================
   PUBLISH POST
========================= */

publishBtn.addEventListener("click", async function() {

  const postTitle =
    title.value.trim();

  const postContent =
    content.value.trim();

  const file =
    imageFile.files[0];


  if (!postTitle) {

    showMessage(
      publishMessage,
      "Post Title লিখুন।",
      "error"
    );

    return;
  }


  if (!postContent) {

    showMessage(
      publishMessage,
      "Post Content লিখুন।",
      "error"
    );

    return;
  }


  if (!file) {

    showMessage(
      publishMessage,
      "একটি ছবি নির্বাচন করুন।",
      "error"
    );

    return;
  }


  publishBtn.disabled = true;

  publishBtn.textContent =
    "⏳ Upload হচ্ছে...";


  try {

    /* =========================
       UNIQUE IMAGE NAME
    ========================= */

    const fileName =
      Date.now() + "_" + file.name;

    const storageRef =
      ref(
        storage,
        "posts/" + fileName
      );


    /* =========================
       UPLOAD IMAGE
    ========================= */

    await uploadBytes(
      storageRef,
      file
    );


    /* =========================
       GET IMAGE URL
    ========================= */

    const imageURL =
      await getDownloadURL(
        storageRef
      );


    publishBtn.textContent =
      "⏳ Post Save হচ্ছে...";


    /* =========================
       SAVE POST TO FIRESTORE
    ========================= */

    await addDoc(
      collection(db, "posts"),
      {
        title: postTitle,

        content: postContent,

        imageUrl: imageURL,

        createdAt:
          serverTimestamp()
      }
    );


    /* =========================
       SUCCESS
    ========================= */

    showMessage(
      publishMessage,
      "✅ Post সফলভাবে প্রকাশ হয়েছে!",
      "success"
    );


    /* CLEAR FORM */

    title.value = "";

    content.value = "";

    imageFile.value = "";

    imagePreview.src = "";

    imagePreview.style.display =
      "none";


  } catch (error) {

    console.error(error);

    showMessage(
      publishMessage,
      "❌ Post প্রকাশ করা যায়নি: " +
      error.message,
      "error"
    );

  }


  publishBtn.disabled = false;

  publishBtn.textContent =
    "🚀 Publish Post";

});


/* =========================
   LOGOUT
========================= */

logoutBtn.addEventListener("click", async function() {

  await signOut(auth);

});


</script>

</body>
</html>
