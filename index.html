<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Beshno Blog</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      color: #1c1e21;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 1000;
      height: 60px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      box-shadow: 0 1px 4px rgba(0,0,0,.15);
    }

    .logo {
      color: #1877f2;
      font-size: 24px;
      font-weight: bold;
    }

    .menu {
      font-size: 25px;
    }

    .container {
      max-width: 680px;
      margin: 20px auto;
      padding: 0 10px;
    }

    .intro {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 1px 3px rgba(0,0,0,.12);
    }

    .intro h1 {
      margin: 0 0 8px;
    }

    .intro p {
      margin: 0;
      color: #65676b;
      line-height: 1.6;
    }

    .post {
      background: white;
      border-radius: 12px;
      margin-bottom: 18px;
      overflow: hidden;
      box-shadow: 0 1px 3px rgba(0,0,0,.12);
    }

    .post-header {
      display: flex;
      align-items: center;
      padding: 15px;
    }

    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #1877f2;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      margin-right: 10px;
    }

    .post-user {
      font-weight: bold;
    }

    .post-date {
      font-size: 13px;
      color: #65676b;
      margin-top: 3px;
    }

    .post-content {
      padding: 0 15px 15px;
    }

    .post-title {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .post-text {
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .post img {
      width: 100%;
      display: block;
      max-height: 600px;
      object-fit: cover;
    }

    .post video {
      width: 100%;
      display: block;
      background: black;
      max-height: 600px;
    }

    .youtube {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: black;
    }

    .youtube iframe {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .post-actions {
      display: flex;
      border-top: 1px solid #ddd;
      padding: 5px 10px;
    }

    .post-actions button {
      flex: 1;
      border: 0;
      background: white;
      padding: 10px;
      font-size: 15px;
      color: #65676b;
    }

    .loading,
    .empty,
    .error {
      background: white;
      padding: 25px;
      text-align: center;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .error {
      color: #b00020;
    }

    footer {
      text-align: center;
      padding: 30px 10px;
      color: #65676b;
    }

    @media (max-width: 600px) {

      .header {
        height: 55px;
      }

      .logo {
        font-size: 21px;
      }

      .container {
        margin-top: 10px;
        padding: 0 5px;
      }

      .post,
      .intro {
        border-radius: 8px;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <div class="logo">Beshno Blog</div>
  <div class="menu">☰</div>
</header>


<main class="container">

  <section class="intro">
    <h1>📰 Beshno Blog</h1>
    <p>
      নতুন খবর, লেখা, ছবি ও ভিডিও দেখতে আমাদের Blog-এর সাথে থাকুন।
    </p>
  </section>


  <div id="posts">

    <div class="loading">
      পোস্ট লোড হচ্ছে...
    </div>

  </div>

</main>


<footer>
  © 2026 Beshno Blog — All Rights Reserved
</footer>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getFirestore,
    collection,
    query,
    orderBy,
    onSnapshot
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  /* =========================
     FIREBASE CONFIG
  ========================= */

  const firebaseConfig = {
    apiKey: "AIzaSyBVOlLubebOhWgYOHwSt7bNkUbqTS_QFu4",
    authDomain: "beshno-blog.firebaseapp.com",
    projectId: "beshno-blog",
    storageBucket: "beshno-blog.firebasestorage.app",
    messagingSenderId: "1070244747427",
    appId: "1:1070244747427:web:0acbf8b3b60cb9121a8716",
    measurementId: "G-VWZZ6YXSPP"
  };


  const app = initializeApp(firebaseConfig);

  const db = getFirestore(app);

  const postsBox =
    document.getElementById("posts");


  /* =========================
     YOUTUBE ID
  ========================= */

  function getYouTubeId(url) {

    if (!url) return "";

    try {

      const parsed =
        new URL(url);

      if (
        parsed.hostname.includes("youtube.com")
      ) {

        return parsed.searchParams.get("v") || "";

      }

      if (
        parsed.hostname === "youtu.be"
      ) {

        return parsed.pathname.substring(1);

      }

    } catch (error) {

      return "";

    }

    return "";

  }


  /* =========================
     DATE
  ========================= */

  function formatDate(timestamp) {

    if (!timestamp) {
      return "এইমাত্র";
    }

    const date =
      timestamp.toDate();

    return date.toLocaleString(
      "bn-BD",
      {
        year: "numeric",
        month: "long",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit"
      }
    );

  }


  /* =========================
     LOAD POSTS
  ========================= */

  const postsQuery = query(
    collection(db, "posts"),
    orderBy("createdAt", "desc")
  );


  onSnapshot(
    postsQuery,

    (snapshot) => {

      postsBox.innerHTML = "";


      if (snapshot.empty) {

        postsBox.innerHTML = `
          <div class="empty">
            এখনো কোনো পোস্ট প্রকাশ করা হয়নি।
          </div>
        `;

        return;
      }


      snapshot.forEach((doc) => {

        const post =
          doc.data();


        const article =
          document.createElement("article");

        article.className = "post";


        /* HEADER */

        const header =
          document.createElement("div");

        header.className =
          "post-header";


        header.innerHTML = `

          <div class="avatar">
            B
          </div>

          <div>

            <div class="post-user">
              ${escapeHTML(
                post.author || "Beshno Blog"
              )}
            </div>

            <div class="post-date">
              ${formatDate(post.createdAt)}
            </div>

          </div>

        `;


        article.appendChild(header);


        /* CONTENT */

        const content =
          document.createElement("div");

        content.className =
          "post-content";


        if (post.title) {

          const title =
            document.createElement("div");

          title.className =
            "post-title";

          title.textContent =
            post.title;

          content.appendChild(title);

        }


        if (post.text) {

          const text =
            document.createElement("div");

          text.className =
            "post-text";

          text.textContent =
            post.text;

          content.appendChild(text);

        }


        article.appendChild(content);


        /* IMAGE */

        if (post.imageUrl) {

          const image =
            document.createElement("img");

          image.src =
            post.imageUrl;

          image.alt =
            post.title || "Beshno Blog";

          image.loading =
            "lazy";

          article.appendChild(image);

        }


        /* VIDEO */

        if (post.videoUrl) {

          const video =
            document.createElement("video");

          video.src =
            post.videoUrl;

          video.controls =
            true;

          video.playsInline =
            true;

          article.appendChild(video);

        }


        /* YOUTUBE */

        if (post.youtubeUrl) {

          const youtubeId =
            getYouTubeId(
              post.youtubeUrl
            );


          if (youtubeId) {

            const youtube =
              document.createElement("div");

            youtube.className =
              "youtube";


            youtube.innerHTML = `

              <iframe
                src="https://www.youtube.com/embed/${youtubeId}"
                title="YouTube video"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
              </iframe>

            `;


            article.appendChild(youtube);

          }

        }


        /* ACTIONS */

        const actions =
          document.createElement("div");

        actions.className =
          "post-actions";


        actions.innerHTML = `

          <button>
            👍 Like
          </button>

          <button>
            💬 Comment
          </button>

          <button>
            ↗ Share
          </button>

        `;


        article.appendChild(actions);


        postsBox.appendChild(article);

      });

    },

    (error) => {

      console.error(error);

      postsBox.innerHTML = `

        <div class="error">
          পোস্ট লোড করা যাচ্ছে না।<br><br>
          ${escapeHTML(error.message)}
        </div>

      `;

    }

  );


  /* =========================
     SECURITY
  ========================= */

  function escapeHTML(value) {

    const div =
      document.createElement("div");

    div.textContent =
      value || "";

    return div.innerHTML;

  }

</script>

</body>
</html>
