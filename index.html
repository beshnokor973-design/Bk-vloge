<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Beshno Blog</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #111;
}

header {
  background: #111;
  color: white;
  padding: 25px 15px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

header p {
  margin: 8px 0 0;
  opacity: .8;
}

.container {
  width: 92%;
  max-width: 750px;
  margin: 25px auto;
}

.post {
  background: white;
  padding: 20px;
  margin-bottom: 25px;
  border-radius: 15px;
  box-shadow: 0 4px 20px rgba(0,0,0,.07);
}

.post h2 {
  margin-top: 0;
  font-size: 25px;
}

.post-text {
  line-height: 1.8;
  white-space: pre-wrap;
}

.post-image {
  width: 100%;
  border-radius: 12px;
  margin-top: 15px;
}

.post-video {
  width: 100%;
  margin-top: 15px;
  border-radius: 12px;
  background: #000;
}

.youtube {
  width: 100%;
  aspect-ratio: 16 / 9;
  margin-top: 15px;
  border: 0;
  border-radius: 12px;
}

.date {
  color: #777;
  font-size: 14px;
  margin-top: 15px;
}

.loading {
  text-align: center;
  padding: 40px;
}

.empty {
  text-align: center;
  background: white;
  padding: 35px;
  border-radius: 15px;
}

</style>

</head>

<body>


<header>

<h1>📰 Beshno Blog</h1>

<p>Latest Posts & Videos</p>

</header>


<div class="container">

<div
  id="posts"
  class="loading"
>
  পোস্ট লোড হচ্ছে...
</div>

</div>


<script type="module">

/* FIREBASE */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* CONFIG */

const firebaseConfig = {

  apiKey:
    "AIzaSyBVOlLubebOhWgYOHwSt7bNkUbqTS_QFu4",

  authDomain:
    "beshno-blog.firebaseapp.com",

  projectId:
    "beshno-blog",

  storageBucket:
    "beshno-blog.firebasestorage.app",

  messagingSenderId:
    "1070244747427",

  appId:
    "1:1070244747427:web:0acbf8b3b60cb9121a8716",

  measurementId:
    "G-VWZZ6YXSPP"

};


/* INITIALIZE */

const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);

const postsBox =
  document.getElementById("posts");


/* YOUTUBE ID */

function getYouTubeId(url) {

  if (!url) return null;

  try {

    const parsed =
      new URL(url);

    if (
      parsed.hostname.includes(
        "youtu.be"
      )
    ) {

      return parsed.pathname
        .replace("/", "");

    }

    if (
      parsed.hostname.includes(
        "youtube.com"
      )
    ) {

      return parsed.searchParams
        .get("v");
    }

  } catch (error) {

    return null;

  }

  return null;
}


/* LOAD POSTS */

async function loadPosts() {

  try {

    const postsQuery =
      query(
        collection(db, "posts"),
        orderBy(
          "createdAt",
          "desc"
        )
      );

    const snapshot =
      await getDocs(
        postsQuery
      );


    if (snapshot.empty) {

      postsBox.className =
        "empty";

      postsBox.innerHTML =
        "এখনও কোনো পোস্ট প্রকাশ করা হয়নি।";

      return;
    }


    postsBox.className = "";


    let html = "";


    snapshot.forEach(
      doc => {

        const post =
          doc.data();


        html += `
          <article class="post">

            <h2>
              ${escapeHTML(
                post.title || ""
              )}
            </h2>


            ${
              post.imageUrl
              ? `
                <img
                  class="post-image"
                  src="${post.imageUrl}"
                  alt="Post Image"
                >
              `
              : ""
            }


            <div class="post-text">
              ${escapeHTML(
                post.content || ""
              )}
            </div>


            ${
              post.videoUrl
              ? `
                <video
                  class="post-video"
                  controls
                  playsinline
                  preload="metadata"
                >

                  <source
                    src="${post.videoUrl}"
                  >

                  আপনার ব্রাউজার ভিডিও চালাতে পারে না।

                </video>
              `
              : ""
            }


            ${
              post.youtubeUrl
              ? getYouTubeId(
                  post.youtubeUrl
                )
                ? `
                  <iframe
                    class="youtube"
                    src="https://www.youtube.com/embed/${getYouTubeId(post.youtubeUrl)}"
                    title="YouTube video"
                    allowfullscreen
                  ></iframe>
                `
                : `
                  <p>
                    ▶️
                    <a
                      href="${post.youtubeUrl}"
                      target="_blank"
                      rel="noopener"
                    >
                      YouTube Video দেখুন
                    </a>
                  </p>
                `
              : ""
            }


            <div class="date">
              Beshno Blog
            </div>

          </article>
        `;

      }
    );


    postsBox.innerHTML =
      html;


  } catch (error) {

    console.error(error);

    postsBox.className =
      "empty";

    postsBox.innerHTML =
      "❌ পোস্ট লোড করা যায়নি।<br><br>" +
      error.message;

  }

}


/* HTML SAFE */

function escapeHTML(text) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    text;

  return div.innerHTML;
}


/* START */

loadPosts();

</script>

</body>
</html>
