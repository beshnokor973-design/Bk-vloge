<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Beshno Blog</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      color: #1c1e21;
    }

    /* HEADER */
    .header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: white;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      box-shadow: 0 1px 4px rgba(0,0,0,.15);
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #1877f2;
    }

    .menu {
      font-size: 25px;
      cursor: pointer;
    }

    /* MAIN */
    .container {
      width: 100%;
      max-width: 680px;
      margin: 20px auto;
      padding: 0 10px;
    }

    /* INTRO */
    .intro {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 1px 3px rgba(0,0,0,.12);
    }

    .intro h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    .intro p {
      margin: 0;
      color: #65676b;
      line-height: 1.6;
    }

    /* POST */
    .post {
      background: white;
      border-radius: 12px;
      margin-bottom: 18px;
      overflow: hidden;
      box-shadow: 0 1px 3px rgba(0,0,0,.12);
    }

    .post-header {
      display: flex;
      align-items: center;
      padding: 15px;
    }

    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #1877f2;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      margin-right: 10px;
    }

    .post-user {
      font-weight: bold;
    }

    .post-date {
      color: #65676b;
      font-size: 13px;
      margin-top: 3px;
    }

    .post-content {
      padding: 0 15px 15px;
    }

    .post-title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .post-text {
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .post img {
      width: 100%;
      display: block;
      max-height: 600px;
      object-fit: cover;
    }

    .post video {
      width: 100%;
      display: block;
      background: black;
      max-height: 600px;
    }

    .youtube {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
    }

    .youtube iframe {
      position: absolute;
      width: 100%;
      height: 100%;
      left: 0;
      top: 0;
      border: 0;
    }

    .post-actions {
      display: flex;
      border-top: 1px solid #ddd;
      padding: 5px 10px;
    }

    .post-actions button {
      flex: 1;
      border: 0;
      background: white;
      padding: 10px;
      font-size: 15px;
      color: #65676b;
      cursor: pointer;
    }

    .post-actions button:hover {
      background: #f0f2f5;
    }

    /* EMPTY */
    .empty {
      background: white;
      padding: 30px;
      text-align: center;
      border-radius: 12px;
      color: #65676b;
    }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 30px 10px;
      color: #65676b;
      font-size: 14px;
    }

    /* MOBILE */
    @media (max-width: 600px) {

      .header {
        height: 55px;
      }

      .logo {
        font-size: 21px;
      }

      .container {
        margin-top: 10px;
        padding: 0 5px;
      }

      .intro {
        border-radius: 8px;
      }

      .post {
        border-radius: 8px;
      }

      .post-title {
        font-size: 19px;
      }

      .post-text {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="logo">Beshno Blog</div>
    <div class="menu">☰</div>
  </header>

  <!-- MAIN -->
  <main class="container">

    <section class="intro">
      <h1>📰 Beshno Blog</h1>
      <p>
        নতুন খবর, লেখা, ছবি ও ভিডিও দেখতে আমাদের Blog-এর সাথে থাকুন।
      </p>
    </section>

    <!-- POSTS WILL APPEAR HERE -->
    <div id="posts">

      <!-- DEMO POST -->
      <article class="post">

        <div class="post-header">
          <div class="avatar">B</div>

          <div>
            <div class="post-user">Beshno Blog</div>
            <div class="post-date">আজ</div>
          </div>
        </div>

        <div class="post-content">

          <div class="post-title">
            Beshno Blog-এ আপনাকে স্বাগতম
          </div>

          <div class="post-text">
এখানে আপনার নতুন পোস্ট, ছবি এবং ভিডিও দেখা যাবে।
          </div>

        </div>

        <div class="post-actions">
          <button>👍 Like</button>
          <button>💬 Comment</button>
          <button>↗ Share</button>
        </div>

      </article>

    </div>

  </main>

  <footer>
    © 2026 Beshno Blog — All Rights Reserved
  </footer>

</body>
</html>
