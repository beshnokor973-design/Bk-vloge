<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to my personal website</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            color: #333;
        }
        header {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }
        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 4px solid white;
            object-fit: cover;
            margin-bottom: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        header h1 {
            margin: 0;
            font-size: 2.2rem;
        }
        header p {
            margin: 10px 0 0;
            font-size: 1.1rem;
            opacity: 0.8;
        }
        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
            text-align: center;
        }
        footer {
            text-align: center;
            padding: 20px;
            background-color: #2c3e50;
            color: white;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <img src="profile.jpg" alt="আমার প্রোফাইল ছবি" class="profile-img">
        <h1>Welcome to my personal website</h1>
        <p>স্বাগতম! এখানে আমি আমার চিন্তাভাবনা এবং অভিজ্ঞতা শেয়ার করি।</p>
    </header>

    <div class="container">
        <!-- পুরোনো পোস্টগুলো এখান থেকে মুছে দেওয়া হয়েছে -->
        <p style="color: #7f8c8d; font-size: 1.2rem; margin-top: 50px;">নতুন পোস্ট শীঘ্রই আসছে...</p>
    </div>

</body>
</html>
