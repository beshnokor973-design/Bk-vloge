<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Beshno Blog | Admin</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
}

.container {
  max-width: 600px;
  margin: 40px auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

input,
textarea {
  width: 100%;
  padding: 13px;
  margin: 8px 0 15px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 16px;
  box-sizing: border-box;
}

textarea {
  min-height: 180px;
}

button {
  width: 100%;
  padding: 13px;
  border: 0;
  border-radius: 8px;
  background: #111;
  color: white;
  font-size: 16px;
}

.logout {
  background: #d00;
  margin-top: 10px;
}

#adminPanel {
  display: none;
}

.message {
  margin-top: 15px;
  padding: 10px;
  border-radius: 8px;
  display: none;
}

.success {
  background: #e8f7e8;
  color: #176b17;
}

.error {
  background: #ffe8e8;
  color: #a00000;
}
</style>
</head>

<body>

<div class="container">

<section class="card" id="loginBox">

<h1>🔐 Beshno Blog Admin</h1>

<p>Admin account দিয়ে Login করুন।</p>

<input
  type="email"
  id="email"
  placeholder="Admin Email"
>

<input
  type="password"
  id="password"
  placeholder="Password"
>

<button id="loginBtn">
Login
</button>

<div id="loginMessage" class="message"></div>

</section>


<section class="card" id="adminPanel">

<h1>📝 Admin Panel</h1>

<p>নতুন Blog Post প্রকাশ করুন।</p>

<label>পোস্টের শিরোনাম</label>

<input
  type="text"
  id="title"
  placeholder="আমার নতুন পোস্ট"
>

<label>পোস্টের লেখা</label>

<textarea
  id="content"
  placeholder="তোমার পোস্ট এখানে লিখো..."
></textarea>

<label>ছবির URL</label>

<input
  type="url"
  id="imageUrl"
  placeholder="https://example.com/image.jpg"
>

<button id="publishBtn">
🚀 Publish Post
</button>

<div id="publishMessage" class="message"></div>

<button class="logout" id="logoutBtn">
Logout
</button>

</section>

</div>


<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
  "AIzaSyBVOlLubebOhWgYOHwSt7bNkUbqTS_QFu4",

  authDomain:
  "beshno-blog.firebaseapp.com",

  projectId:
  "beshno-blog",

  storageBucket:
  "beshno-blog.firebasestorage.app",

  messagingSenderId:
  "1070244747427",

  appId:
  "1:1070244747427:web:0acbf8b3b60cb9121a8716",

  measurementId:
  "G-VWZZ6YXSPP"
};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


const loginBox =
  document.getElementById("loginBox");

const adminPanel =
  document.getElementById("adminPanel");

const email =
  document.getElementById("email");

const password =
  document.getElementById("password");

const loginBtn =
  document.getElementById("loginBtn");

const logoutBtn =
  document.getElementById("logoutBtn");

const publishBtn =
  document.getElementById("publishBtn");

const title =
  document.getElementById("title");

const content =
  document.getElementById("content");

const imageUrl =
  document.getElementById("imageUrl");

const loginMessage =
  document.getElementById("loginMessage");

const publishMessage =
  document.getElementById("publishMessage");


function showMessage(element, text, type) {

  element.textContent = text;

  element.className =
    "message " + type;

  element.style.display =
    "block";
}


/* LOGIN */

loginBtn.addEventListener("click", async () => {

  const userEmail =
    email.value.trim();

  const userPassword =
    password.value;

  if (!userEmail || !userPassword) {

    showMessage(
      loginMessage,
      "Email এবং Password দিন।",
      "error"
    );

    return;
  }

  try {

    await signInWithEmailAndPassword(
      auth,
      userEmail,
      userPassword
    );

  } catch (error) {

    showMessage(
      loginMessage,
      "Login ব্যর্থ হয়েছে। Email অথবা Password পরীক্ষা করুন।",
      "error"
    );

  }

});


/* LOGIN CHECK */

onAuthStateChanged(auth, (user) => {

  if (user) {

    loginBox.style.display =
      "none";

    adminPanel.style.display =
      "block";

  } else {

    loginBox.style.display =
      "block";

    adminPanel.style.display =
      "none";

  }

});


/* PUBLISH */

publishBtn.addEventListener("click", async () => {

  const postTitle =
    title.value.trim();

  const postContent =
    content.value.trim();

  const postImage =
    imageUrl.value.trim();


  if (!postTitle || !postContent) {

    showMessage(
      publishMessage,
      "শিরোনাম এবং পোস্টের লেখা দিতে হবে।",
      "error"
    );

    return;
  }


  publishBtn.disabled = true;

  publishBtn.textContent =
    "Publishing...";


  try {

    await addDoc(
      collection(db, "posts"),
      {

        title: postTitle,

        content: postContent,

        imageUrl: postImage,

        createdAt: serverTimestamp(),

        author:
          auth.currentUser.email

      }
    );


    showMessage(
      publishMessage,
      "🎉 পোস্ট সফলভাবে প্রকাশ হয়েছে!",
      "success"
    );


    title.value = "";

    content.value = "";

    imageUrl.value = "";


  } catch (error) {

    console.error(error);

    showMessage(
      publishMessage,
      "পোস্ট প্রকাশ করা যায়নি।",
      "error"
    );

  }


  publishBtn.disabled = false;

  publishBtn.textContent =
    "🚀 Publish Post";

});


/* LOGOUT */

logoutBtn.addEventListener("click", async () => {

  await signOut(auth);

});

</script>

</body>
</html>
