<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Beshno Blog | Admin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f0f2f5;
}

.container{
  max-width:650px;
  margin:30px auto;
  padding:15px;
}

.card{
  background:#fff;
  border-radius:15px;
  padding:20px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
  margin-bottom:20px;
}

h1{margin-top:0}

input,textarea{
  width:100%;
  border:1px solid #ddd;
  border-radius:10px;
  padding:13px;
  font-size:16px;
  margin:7px 0 14px;
}

textarea{
  min-height:160px;
  resize:vertical;
}

button{
  width:100%;
  border:0;
  border-radius:10px;
  padding:14px;
  font-size:16px;
  cursor:pointer;
  background:#111;
  color:#fff;
}

button:disabled{
  opacity:.6;
}

.logout{
  background:#d00;
  margin-top:10px;
}

.option{
  border:1px solid #ddd;
  border-radius:10px;
  padding:13px;
  margin:10px 0;
  cursor:pointer;
}

.option:hover{
  background:#f5f5f5;
}

.preview{
  width:100%;
  max-height:350px;
  object-fit:cover;
  border-radius:10px;
  margin:10px 0;
  display:none;
}

.videoPreview{
  width:100%;
  border-radius:10px;
  margin-top:10px;
  display:none;
}

.message{
  padding:12px;
  border-radius:10px;
  margin-top:15px;
  display:none;
}

.success{
  background:#e7f7e7;
  color:#176b17;
}

.error{
  background:#ffe7e7;
  color:#a00000;
}

#adminPanel{
  display:none;
}

.progress{
  width:100%;
  height:8px;
  background:#ddd;
  border-radius:10px;
  overflow:hidden;
  display:none;
  margin:10px 0;
}

.progressBar{
  width:0%;
  height:100%;
  background:#111;
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->

<section class="card" id="loginBox">

<h1>🔐 Beshno Blog Admin</h1>

<p>Admin account দিয়ে Login করুন।</p>

<input
type="email"
id="email"
placeholder="Admin Email"
>

<input
type="password"
id="password"
placeholder="Password"
>

<button id="loginBtn">
Login
</button>

<div id="loginMessage" class="message"></div>

</section>


<!-- ADMIN -->

<section class="card" id="adminPanel">

<h1>📝 Create Post</h1>

<p style="color:#666">
আজ কী পোস্ট করবেন?
</p>

<!-- TITLE -->

<input
type="text"
id="title"
placeholder="Post Title"
>


<!-- CONTENT -->

<textarea
id="content"
placeholder="আপনার পোস্ট লিখুন..."
></textarea>


<!-- PHOTO -->

<div class="option">

<b>📷 Photo</b>

<br><br>

<input
type="file"
id="imageFile"
accept="image/*"
>

<img
id="imagePreview"
class="preview"
alt="Image Preview"
>

</div>


<!-- VIDEO -->

<div class="option">

<b>🎬 Video</b>

<br><br>

<input
type="file"
id="videoFile"
accept="video/*"
>

<video
id="videoPreview"
class="videoPreview"
controls
></video>

</div>


<!-- YOUTUBE -->

<div class="option">

<b>▶️ YouTube Video</b>

<input
type="url"
id="youtubeUrl"
placeholder="YouTube video URL"
>

</div>


<!-- PROGRESS -->

<div id="progress" class="progress">

<div
id="progressBar"
class="progressBar">
</div>

</div>


<!-- PUBLISH -->

<button id="publishBtn">
🚀 Publish Post
</button>

<div
id="publishMessage"
class="message">
</div>


<button
id="logoutBtn"
class="logout">
Logout
</button>

</section>

</div>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
getFirestore,
collection,
addDoc,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


import {
getStorage,
ref,
uploadBytes,
getDownloadURL
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";


/* FIREBASE */

const firebaseConfig = {

apiKey:
"AIzaSyBVOlLubebOhWgYOHwSt7bNkUbqTS_QFu4",

authDomain:
"beshno-blog.firebaseapp.com",

projectId:
"beshno-blog",

storageBucket:
"beshno-blog.firebasestorage.app",

messagingSenderId:
"1070244747427",

appId:
"1:1070244747427:web:0acbf8b3b60cb9121a8716",

measurementId:
"G-VWZZ6YXSPP"

};


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getFirestore(app);

const storage =
getStorage(app);


/* ELEMENTS */

const loginBox =
document.getElementById("loginBox");

const adminPanel =
document.getElementById("adminPanel");

const loginBtn =
document.getElementById("loginBtn");

const logoutBtn =
document.getElementById("logoutBtn");

const email =
document.getElementById("email");

const password =
document.getElementById("password");

const title =
document.getElementById("title");

const content =
document.getElementById("content");

const imageFile =
document.getElementById("imageFile");

const videoFile =
document.getElementById("videoFile");

const youtubeUrl =
document.getElementById("youtubeUrl");

const imagePreview =
document.getElementById("imagePreview");

const videoPreview =
document.getElementById("videoPreview");

const publishBtn =
document.getElementById("publishBtn");

const loginMessage =
document.getElementById("loginMessage");

const publishMessage =
document.getElementById("publishMessage");

const progress =
document.getElementById("progress");

const progressBar =
document.getElementById("progressBar");


/* MESSAGE */

function message(element,text,type){

element.textContent=text;

element.className=
"message "+type;

element.style.display="block";

}


/* IMAGE PREVIEW */

imageFile.addEventListener(
"change",
()=>{

const file=
imageFile.files[0];

if(!file){

imagePreview.style.display="none";

return;
}

imagePreview.src=
URL.createObjectURL(file);

imagePreview.style.display="block";

});


/* VIDEO PREVIEW */

videoFile.addEventListener(
"change",
()=>{

const file=
videoFile.files[0];

if(!file){

videoPreview.style.display="none";

return;
}

videoPreview.src=
URL.createObjectURL(file);

videoPreview.style.display="block";

});


/* LOGIN */

loginBtn.addEventListener(
"click",
async()=>{

const userEmail=
email.value.trim();

const userPassword=
password.value;

if(!userEmail ||
!userPassword){

message(
loginMessage,
"Email এবং Password দিন।",
"error"
);

return;
}

try{

loginBtn.disabled=true;

loginBtn.textContent=
"Login হচ্ছে...";

await signInWithEmailAndPassword(
auth,
userEmail,
userPassword
);

}catch(error){

console.error(error);

message(
loginMessage,
"Login হয়নি। Email অথবা Password পরীক্ষা করুন।",
"error"
);

}

loginBtn.disabled=false;

loginBtn.textContent="Login";

});


/* LOGIN STATE */

onAuthStateChanged(
auth,
(user)=>{

if(user){

loginBox.style.display="none";

adminPanel.style.display="block";

}else{

loginBox.style.display="block";

adminPanel.style.display="none";

}

});


/* UPLOAD FILE */

async function uploadFile(file,folder){

if(!file)return null;

const fileName=
Date.now()+"_"+file.name;

const storageRef=
ref(
storage,
folder+"/"+fileName
);

await uploadBytes(
storageRef,
file
);

return await getDownloadURL(
storageRef
);

}


/* PUBLISH */

publishBtn.addEventListener(
"click",
async()=>{

const postTitle=
title.value.trim();

const postContent=
content.value.trim();

const image=
imageFile.files[0];

const video=
videoFile.files[0];

const youtube=
youtubeUrl.value.trim();


/* VALIDATION */

if(
!postTitle &&
!postContent &&
!image &&
!video &&
!youtube
){

message(
publishMessage,
"কিছু একটা Post করুন।",
"error"
);

return;

}


/* START */

try{

publishBtn.disabled=true;

publishBtn.textContent=
"⏳ Publishing...";

progress.style.display="block";

progressBar.style.width="20%";


/* IMAGE */

let imageUrl=null;

if(image){

imageUrl=
await uploadFile(
image,
"posts/images"
);

}

progressBar.style.width="50%";


/* VIDEO */

let videoUrl=null;

if(video){

videoUrl=
await uploadFile(
video,
"posts/videos"
);

}

progressBar.style.width="75%";


/* FIRESTORE */

await addDoc(
collection(db,"posts"),
{

title:postTitle,

content:postContent,

imageUrl:imageUrl,

videoUrl:videoUrl,

youtubeUrl:youtube || null,

createdAt:
serverTimestamp()

});


progressBar.style.width="100%";


/* SUCCESS */

message(
publishMessage,
"✅ Post সফলভাবে Publish হয়েছে!",
"success"
);


/* CLEAR */

title.value="";

content.value="";

imageFile.value="";

videoFile.value="";

youtubeUrl.value="";

imagePreview.src="";

imagePreview.style.display="none";

videoPreview.src="";

videoPreview.style.display="none";


}catch(error){

console.error(error);

message(
publishMessage,
"❌ Post করা যায়নি: "+
error.message,
"error"
);

}


publishBtn.disabled=false;

publishBtn.textContent=
"🚀 Publish Post";

setTimeout(
()=>{
progress.style.display="none";
progressBar.style.width="0%";
},
1000
);

});


/* LOGOUT */

logoutBtn.addEventListener(
"click",
async()=>{

await signOut(auth);

});

</script>

</body>
</html>
