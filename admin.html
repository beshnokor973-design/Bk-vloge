<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Beshno Blog | Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f2f5;
    }

    .container {
      max-width: 650px;
      margin: 30px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
    }

    h1 {
      margin-top: 0;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      margin: 7px 0 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #1877f2;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
    }

    .logout {
      background: #e41e3f;
      margin-top: 10px;
    }

    #adminPanel {
      display: none;
    }

    .preview {
      width: 100%;
      max-height: 350px;
      object-fit: contain;
      display: none;
      margin-bottom: 15px;
      border-radius: 10px;
      background: #000;
    }

    .message {
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      display: none;
    }

    .success {
      background: #e7f7e7;
      color: #176b17;
    }

    .error {
      background: #ffe8e8;
      color: #a00000;
    }

    .progress {
      width: 100%;
      height: 8px;
      background: #ddd;
      border-radius: 10px;
      overflow: hidden;
      margin: 15px 0;
      display: none;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: #1877f2;
      transition: width .2s;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 10px;
    }

    @media(max-width:600px) {
      .container {
        margin: 10px auto;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <section class="card" id="loginBox">

    <h1>🔐 Beshno Blog Admin</h1>

    <p>Admin account দিয়ে Login করুন।</p>

    <input
      type="email"
      id="email"
      placeholder="Admin Email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button id="loginBtn">
      Login
    </button>

    <div id="loginMessage" class="message"></div>

  </section>


  <!-- ADMIN PANEL -->
  <section class="card" id="adminPanel">

    <h1>📝 নতুন পোস্ট</h1>

    <label>পোস্টের শিরোনাম</label>

    <input
      type="text"
      id="title"
      placeholder="আমার নতুন পোস্ট"
    >


    <label>পোস্টের লেখা</label>

    <textarea
      id="text"
      placeholder="আপনার পোস্টের লেখা এখানে লিখুন..."
    ></textarea>


    <label>📷 ছবি</label>

    <input
      type="file"
      id="imageFile"
      accept="image/*"
    >

    <img
      id="imagePreview"
      class="preview"
      alt="Image Preview"
    >


    <label>🎬 ভিডিও</label>

    <input
      type="file"
      id="videoFile"
      accept="video/*"
    >

    <video
      id="videoPreview"
      class="preview"
      controls
    ></video>


    <label>▶️ YouTube ভিডিও</label>

    <input
      type="url"
      id="youtubeUrl"
      placeholder="https://www.youtube.com/watch?v=..."
    >


    <div class="progress" id="progress">
      <div
        class="progress-bar"
        id="progressBar"
      ></div>
    </div>


    <button id="postBtn">
      🚀 পোস্ট প্রকাশ করুন
    </button>

    <div id="postMessage" class="message"></div>

    <button
      class="logout"
      id="logoutBtn"
    >
      Logout
    </button>

  </section>

</div>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

  import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

  import {
    getStorage,
    ref,
    uploadBytes,
    getDownloadURL
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js";


  /* =========================
     FIREBASE CONFIG
  ========================= */

  const firebaseConfig = {
    apiKey: "AIzaSyBVOlLubebOhWgYOHwSt7bNkUbqTS_QFu4",
    authDomain: "beshno-blog.firebaseapp.com",
    projectId: "beshno-blog",
    storageBucket: "beshno-blog.firebasestorage.app",
    messagingSenderId: "1070244747427",
    appId: "1:1070244747427:web:0acbf8b3b60cb9121a8716",
    measurementId: "G-VWZZ6YXSPP"
  };


  /* =========================
     FIREBASE START
  ========================= */

  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);

  const storage = getStorage(app);


  /* =========================
     ELEMENTS
  ========================= */

  const loginBox =
    document.getElementById("loginBox");

  const adminPanel =
    document.getElementById("adminPanel");

  const loginBtn =
    document.getElementById("loginBtn");

  const logoutBtn =
    document.getElementById("logoutBtn");

  const postBtn =
    document.getElementById("postBtn");

  const email =
    document.getElementById("email");

  const password =
    document.getElementById("password");

  const title =
    document.getElementById("title");

  const text =
    document.getElementById("text");

  const imageFile =
    document.getElementById("imageFile");

  const videoFile =
    document.getElementById("videoFile");

  const youtubeUrl =
    document.getElementById("youtubeUrl");

  const imagePreview =
    document.getElementById("imagePreview");

  const videoPreview =
    document.getElementById("videoPreview");

  const loginMessage =
    document.getElementById("loginMessage");

  const postMessage =
    document.getElementById("postMessage");

  const progress =
    document.getElementById("progress");

  const progressBar =
    document.getElementById("progressBar");


  /* =========================
     MESSAGE
  ========================= */

  function showMessage(element, message, type) {

    element.textContent = message;

    element.className =
      "message " + type;

    element.style.display = "block";

  }


  /* =========================
     LOGIN
  ========================= */

  loginBtn.addEventListener("click", async () => {

    const userEmail =
      email.value.trim();

    const userPassword =
      password.value;

    if (!userEmail || !userPassword) {

      showMessage(
        loginMessage,
        "Email এবং Password দিন।",
        "error"
      );

      return;
    }

    loginBtn.disabled = true;

    loginBtn.textContent =
      "Login হচ্ছে...";

    try {

      await signInWithEmailAndPassword(
        auth,
        userEmail,
        userPassword
      );

      showMessage(
        loginMessage,
        "Login সফল হয়েছে।",
        "success"
      );

    } catch (error) {

      showMessage(
        loginMessage,
        "Login ব্যর্থ হয়েছে। Email/Password পরীক্ষা করুন।",
        "error"
      );

    }

    loginBtn.disabled = false;

    loginBtn.textContent = "Login";

  });


  /* =========================
     AUTH STATE
  ========================= */

  onAuthStateChanged(auth, (user) => {

    if (user) {

      loginBox.style.display = "none";

      adminPanel.style.display = "block";

    } else {

      loginBox.style.display = "block";

      adminPanel.style.display = "none";

    }

  });


  /* =========================
     IMAGE PREVIEW
  ========================= */

  imageFile.addEventListener("change", () => {

    const file = imageFile.files[0];

    if (!file) {

      imagePreview.style.display = "none";

      return;

    }

    imagePreview.src =
      URL.createObjectURL(file);

    imagePreview.style.display = "block";

  });


  /* =========================
     VIDEO PREVIEW
  ========================= */

  videoFile.addEventListener("change", () => {

    const file = videoFile.files[0];

    if (!file) {

      videoPreview.style.display = "none";

      return;

    }

    videoPreview.src =
      URL.createObjectURL(file);

    videoPreview.style.display = "block";

  });


  /* =========================
     UPLOAD FILE
  ========================= */

  async function uploadFile(file, folder) {

    const fileName =
      Date.now() +
      "_" +
      file.name.replace(/\s+/g, "_");

    const fileRef =
      ref(
        storage,
        folder + "/" + fileName
      );

    await uploadBytes(
      fileRef,
      file
    );

    return await getDownloadURL(fileRef);

  }


  /* =========================
     CREATE POST
  ========================= */

  postBtn.addEventListener("click", async () => {

    const postTitle =
      title.value.trim();

    const postText =
      text.value.trim();

    const image =
      imageFile.files[0];

    const video =
      videoFile.files[0];

    const youtube =
      youtubeUrl.value.trim();


    if (!postTitle && !postText && !image && !video && !youtube) {

      showMessage(
        postMessage,
        "কমপক্ষে একটি পোস্টের তথ্য দিন।",
        "error"
      );

      return;

    }


    postBtn.disabled = true;

    postBtn.textContent =
      "পোস্ট তৈরি হচ্ছে...";

    progress.style.display = "block";

    progressBar.style.width = "10%";


    try {

      let imageUrl = "";

      let videoUrl = "";


      /* IMAGE */

      if (image) {

        imageUrl =
          await uploadFile(
            image,
            "posts/images"
          );

      }

      progressBar.style.width = "40%";


      /* VIDEO */

      if (video) {

        videoUrl =
          await uploadFile(
            video,
            "posts/videos"
          );

      }

      progressBar.style.width = "70%";


      /* FIRESTORE */

      await addDoc(
        collection(db, "posts"),
        {

          title: postTitle,

          text: postText,

          imageUrl: imageUrl,

          videoUrl: videoUrl,

          youtubeUrl: youtube,

          author: "Beshno Blog",

          createdAt: serverTimestamp()

        }
      );


      progressBar.style.width = "100%";


      showMessage(
        postMessage,
        "✅ পোস্ট সফলভাবে প্রকাশ হয়েছে!",
        "success"
      );


      /* CLEAR */

      title.value = "";

      text.value = "";

      imageFile.value = "";

      videoFile.value = "";

      youtubeUrl.value = "";

      imagePreview.src = "";

      imagePreview.style.display = "none";

      videoPreview.src = "";

      videoPreview.style.display = "none";


    } catch (error) {

      console.error(error);

      showMessage(
        postMessage,
        "❌ পোস্ট করা যায়নি: " +
        error.message,
        "error"
      );

    }


    postBtn.disabled = false;

    postBtn.textContent =
      "🚀 পোস্ট প্রকাশ করুন";

  });


  /* =========================
     LOGOUT
  ========================= */

  logoutBtn.addEventListener("click", async () => {

    await signOut(auth);

  });

</script>

</body>
</html>
