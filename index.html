```html
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Beshno Blog</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f0f2f5;
  color:#1c1e21;
}

.header{
  position:sticky;
  top:0;
  z-index:1000;
  height:60px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  box-shadow:0 1px 4px rgba(0,0,0,.15);
}

.logo{
  color:#1877f2;
  font-size:24px;
  font-weight:bold;
}

.container{
  max-width:680px;
  margin:20px auto;
  padding:0 10px;
}

.intro,.post{
  background:#fff;
  border-radius:12px;
  margin-bottom:18px;
  box-shadow:0 1px 3px rgba(0,0,0,.12);
}

.intro{
  padding:20px;
}

.intro h1{
  margin:0 0 8px;
}

.intro p{
  margin:0;
  color:#65676b;
}

.post{
  overflow:hidden;
}

.post-header{
  display:flex;
  align-items:center;
  padding:15px;
}

.avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  background:#1877f2;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  margin-right:10px;
}

.post-user{
  font-weight:bold;
}

.post-date{
  color:#65676b;
  font-size:13px;
  margin-top:3px;
}

.post-content{
  padding:0 15px 15px;
}

.post-title{
  font-size:21px;
  font-weight:bold;
  margin-bottom:8px;
}

  white-space:pre-wrap;
}

.post img{
  width:100%;

}

.post video{
  width:100%;
  display:block;

}

  padding-top:56.25%;

  position:absolute;

  .logo{font-size:21px}
  .container{
    margin-top:10px;

  }
  .post,.intro{
    border-radius:8px;
  }

</style>
</head>

<body>

<header class="header">
  <div class="logo">Beshno Blog</div>
  <div>☰</div>
</header>

<main class="container">

<section class="intro">
  <h1>📰 Beshno Blog</h1>
  <p>
    নতুন খবর, লেখা, ছবি ও ভিডিও দেখতে আমাদের Blog-এর সাথে থাকুন।
  </p>
</section>

<div id="posts">
  <div class="loading">পোস্ট লোড হচ্ছে...</div>
</div>

</main>

<footer>
© 2026 Beshno Blog — All Rights Reserved
</footer>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getFirestore,
  collection,
  query,
  orderBy,
  onSnapshot,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig = {
  apiKey:"AIzaSyBVOlLubebOhWgYOHwSt7bNkUbqTS_QFu4",
  authDomain:"beshno-blog.firebaseapp.com",
  projectId:"beshno-blog",
  storageBucket:"beshno-blog.firebasestorage.app",
  messagingSenderId:"1070244747427",
  appId:"1:1070244747427:web:0acbf8b3b60cb9121a8716",
  measurementId:"G-VWZZ6YXSPP"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const postsBox=document.getElementById("posts");


/* YOUTUBE */

function getYouTubeId(url){

  if(!url) return "";

  try{

    const u=new URL(url);

    if(u.hostname.includes("youtube.com")){
      return u.searchParams.get("v") || "";
    }

    if(u.hostname==="youtu.be"){
      return u.pathname.substring(1);
    }

  }catch(e){}

  return "";
}


/* DATE */

function formatDate(timestamp){

  if(!timestamp) return "এইমাত্র";

  return timestamp.toDate().toLocaleString(
    "bn-BD",
    {
      year:"numeric",
      month:"long",
      day:"numeric",
      hour:"numeric",
      minute:"2-digit"
    }
  );
}


/* LOAD POSTS */

const postsQuery=query(
  collection(db,"posts"),
  orderBy("createdAt","desc")
);

onSnapshot(
  postsQuery,
  snapshot=>{

    postsBox.innerHTML="";

    if(snapshot.empty){

      postsBox.innerHTML=`
        <div class="empty">
          এখনো কোনো পোস্ট প্রকাশ করা হয়নি।
        </div>
      `;

      return;
    }


    snapshot.forEach(doc=>{

      const post=doc.data();
      const postId=doc.id;

      const article=document.createElement("article");
      article.className="post";


      /* HEADER */

      article.innerHTML=`

        <div class="post-header">

          <div class="avatar">B</div>

          <div>

            <div class="post-user">
              ${escapeHTML(post.author || "Beshno Blog")}
            </div>

            <div class="post-date">
              ${formatDate(post.createdAt)}
            </div>

          </div>

        </div>

      `;


      /* CONTENT */

      const content=document.createElement("div");
      content.className="post-content";


      if(post.title){

        const title=document.createElement("div");

        title.className="post-title";
        title.textContent=post.title;

        content.appendChild(title);
      }


      if(post.text){

        const text=document.createElement("div");

        text.className="post-text";
        text.textContent=post.text;

        content.appendChild(text);
      }


      article.appendChild(content);


      /* IMAGE */

      if(post.imageUrl){

        const image=document.createElement("img");

        image.src=post.imageUrl;
        image.alt=post.title || "Beshno Blog";
        image.loading="lazy";

        article.appendChild(image);
      }


      /* VIDEO */

      if(post.videoUrl){

        const video=document.createElement("video");

        video.src=post.videoUrl;
        video.controls=true;
        video.playsInline=true;

        article.appendChild(video);
      }


      /* YOUTUBE */

      if(post.youtubeUrl){

        const id=getYouTubeId(post.youtubeUrl);

        if(id){

          const youtube=document.createElement("div");

          youtube.className="youtube";

          youtube.innerHTML=`
            <iframe
              src="https://www.youtube.com/embed/${id}"
              title="YouTube video"
              allowfullscreen>
            </iframe>
          `;

          article.appendChild(youtube);
        }
      }


      /* ACTIONS */

      const actions=document.createElement("div");

      actions.className="post-actions";

      actions.innerHTML=`

        <button class="like-btn">
          👍 Like
        </button>

        <button class="comment-btn">
          💬 Comment
        </button>

        <button class="share-btn">
          ↗ Share
        </button>

      `;

      article.appendChild(actions);


      /* COMMENTS */

      const comments=document.createElement("div");

      comments.className="comments";

      comments.innerHTML=`

        <div class="comment-form">

          <input
            type="text"
            placeholder="আপনার মন্তব্য লিখুন..."
          >

          <button>
            Post
          </button>

        </div>

        <div class="comment-list">
          মন্তব্য লোড হচ্ছে...
        </div>

      `;

      article.appendChild(comments);


      /* LIKE */

      const likeBtn=
        actions.querySelector(".like-btn");

      likeBtn.addEventListener("click",()=>{

        likeBtn.classList.toggle("liked");

        likeBtn.textContent=
          likeBtn.classList.contains("liked")
          ? "👍 Liked"
          : "👍 Like";

      });


      /* COMMENT SHOW */

      const commentBtn=
        actions.querySelector(".comment-btn");

      commentBtn.addEventListener("click",()=>{

        comments.classList.toggle("show");

      });


      /* SHARE */

      const shareBtn=
        actions.querySelector(".share-btn");

      shareBtn.addEventListener("click",async()=>{

        const url=
          window.location.origin +
          window.location.pathname +
          "#post-" +
          postId;

        try{

          if(navigator.share){

            await navigator.share({
              title:post.title || "Beshno Blog",
              text:"Beshno Blog-এর একটি পোস্ট",
              url:url
            });

          }else{

            await navigator.clipboard.writeText(url);

            alert("পোস্টের লিংক কপি হয়েছে!");

          }

        }catch(e){}

      });


      /* COMMENT FORM */

      const input=
        comments.querySelector("input");

      const submit=
        comments.querySelector("button");

      const list=
        comments.querySelector(".comment-list");


      submit.addEventListener("click",async()=>{

        const comment=input.value.trim();

        if(!comment){
          return;
        }

        submit.disabled=true;
        submit.textContent="Posting...";

        try{

          await addDoc(
            collection(
              db,
              "posts",
              postId,
              "comments"
            ),
            {
              name:"Visitor",
              text:comment,
              createdAt:serverTimestamp()
            }
          );

          input.value="";

        }catch(error){

          alert(
            "Comment করা যায়নি: " +
            error.message
          );

        }

        submit.disabled=false;
        submit.textContent="Post";

      });


      /* LOAD COMMENTS */

      const commentsQuery=query(
        collection(
          db,
          "posts",
          postId,
          "comments"
        ),
        orderBy("createdAt","asc")
      );


      onSnapshot(
        commentsQuery,
        commentSnapshot=>{

          list.innerHTML="";

          commentSnapshot.forEach(commentDoc=>{

            const c=commentDoc.data();

            const div=
              document.createElement("div");

            div.className="comment";

            div.innerHTML=`

              <div class="comment-name">
                ${escapeHTML(c.name || "Visitor")}
              </div>

              <div class="comment-text">
                ${escapeHTML(c.text || "")}
              </div>

            `;

            list.appendChild(div);

          });

          if(commentSnapshot.empty){

            list.innerHTML=
              "<small>এখনো কোনো মন্তব্য নেই।</small>";

          }

        }
      );


      postsBox.appendChild(article);

    });

  },

  error=>{

    console.error(error);

    postsBox.innerHTML=`

      <div class="error">
        পোস্ট লোড করা যাচ্ছে না।<br><br>
        ${escapeHTML(error.message)}
      </div>

    `;

  }
);


/* SECURITY */

function escapeHTML(value){

  const div=document.createElement("div");

  div.textContent=value || "";

  return div.innerHTML;
}

</script>

</body>
</html>
```
