<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Beshno Blog | Official</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f0f2f5;
  color:#1c1e21;
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:1000;
  height:64px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  box-shadow:0 1px 5px rgba(0,0,0,.15);
}

.logo{
  color:#1877f2;
  font-size:24px;
  font-weight:bold;
}

.menu{
  font-size:25px;
  color:#1877f2;
}

/* MAIN */

.container{
  max-width:700px;
  margin:18px auto;
  padding:0 10px;
}

/* PROFILE */

.profile-card{
  background:#fff;
  border-radius:14px;
  padding:22px;
  margin-bottom:18px;
  text-align:center;
  box-shadow:0 1px 4px rgba(0,0,0,.12);
}

.profile-pic{
  width:100px;
  height:100px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #1877f2;
}

.profile-name{
  font-size:24px;
  font-weight:bold;
  margin:12px 0 5px;
}

.profile-text{
  color:#65676b;
  margin:5px 0 15px;
}

/* SOCIAL LINKS */

.social-links{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.social-btn{
  text-decoration:none;
  padding:9px 15px;
  border-radius:8px;
  font-weight:bold;
}

.facebook{
  background:#1877f2;
  color:white;
}

.youtube{
  background:#ff0000;
  color:white;
}

/* FOLLOW */

.follow-box{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}

.follow-btn{
  border:0;
  background:#1877f2;
  color:white;
  padding:10px 24px;
  border-radius:8px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.follow-btn.following{
  background:#e4e6eb;
  color:#050505;
}

#followerCount{
  color:#65676b;
  font-size:14px;
}

/* POST */

.post{
  background:#fff;
  border-radius:14px;
  margin-bottom:18px;
  overflow:hidden;
  box-shadow:0 1px 4px rgba(0,0,0,.12);
}

.post-header{
  padding:15px 17px 8px;
}

.post-title{
  font-size:20px;
  font-weight:bold;
  margin:0 0 8px;
}

.post-date{
  color:#65676b;
  font-size:13px;
}

.post-content{
  padding:5px 17px 15px;
  line-height:1.7;
  white-space:pre-wrap;
}

.post-image{
  width:100%;
  display:block;
  max-height:600px;
  object-fit:cover;
}

.post-video{
  width:100%;
  display:block;
  background:#000;
}

.youtube-box{
  position:relative;
  width:100%;
  padding-bottom:56.25%;
  height:0;
  overflow:hidden;
}

.youtube-box iframe{
  position:absolute;
  width:100%;
  height:100%;
  left:0;
  top:0;
  border:0;
}

/* POST BUTTONS */

.post-actions{
  display:flex;
  border-top:1px solid #ddd;
}

.post-actions button{
  flex:1;
  border:0;
  background:white;
  padding:13px 5px;
  font-size:15px;
  cursor:pointer;
}

.post-actions button:hover{
  background:#f0f2f5;
}

/* FOOTER */

.footer{
  text-align:center;
  padding:25px 10px;
  color:#65676b;
  font-size:14px;
}

.footer a{
  color:#1877f2;
  text-decoration:none;
  margin:0 5px;
}

/* MOBILE */

@media(max-width:600px){

  .header{
    height:58px;
  }

  .logo{
    font-size:21px;
  }

  .container{
    margin-top:10px;
  }

  .profile-card{
    border-radius:10px;
  }

  .post{
    border-radius:10px;
  }

}

</style>
</head>

<body>

<!-- HEADER -->

<header class="header">

  <div class="logo">
    Beshno Blog
  </div>

  <div class="menu">
    ☰
  </div>

</header>


<main class="container">


<!-- PROFILE -->

<section class="profile-card">

  <!-- এখানে তোমার profile picture-এর URL বসাবে -->
  <img
    class="profile-pic"
    src="https://via.placeholder.com/200"
    alt="Beshno Blog Profile"
  >

  <div class="profile-name">
    Beshno Blog
  </div>

  <div class="profile-text">
    Official Blog &amp; Media
  </div>


  <!-- FACEBOOK + YOUTUBE -->

  <div class="social-links">

    <a
      class="social-btn facebook"
      href="https://www.facebook.com/profile.php?id=61593040285317"
      target="_blank"
      rel="noopener noreferrer"
    >
      🔵 Facebook
    </a>

    <a
      class="social-btn youtube"
      href="https://www.youtube.com/@beshnobloge"
      target="_blank"
      rel="noopener noreferrer"
    >
      🔴 YouTube
    </a>

  </div>


  <!-- FOLLOW -->

  <div class="follow-box">

    <button
      id="followBtn"
      class="follow-btn"
      onclick="toggleFollow()"
    >
      ➕ Follow
    </button>

    <span id="followerCount">
      0 followers
    </span>

  </div>

</section>


<!-- POSTS -->

<section id="posts">


  <!-- POST 1 -->

  <article class="post">

    <div class="post-header">

      <div class="post-title">
        Beshno Blog-এ স্বাগতম
      </div>

      <div class="post-date">
        Beshno Blog • Official
      </div>

    </div>

    <div class="post-content">
      Beshno Blog-এর নতুন পোস্ট, তথ্য ও ভিডিও পেতে আমাদের Follow করে রাখুন।
    </div>

    <div class="post-actions">

      <button onclick="likePost(this)">
        👍 Like
      </button>

      <button onclick="sharePost()">
        ↗ Share
      </button>

    </div>

  </article>


</section>


</main>


<!-- FOOTER -->

<footer class="footer">

  <div>

    <a href="about.html">
      About Us
    </a>

    |

    <a href="contact.html">
      Contact Us
    </a>

    |

    <a href="privacy.html">
      Privacy Policy
    </a>

    |

    <a href="terms.html">
      Terms &amp; Conditions
    </a>

  </div>

  <br>

  © 2026 Beshno Blog. All rights reserved.

</footer>


<script>

/* =========================
   FOLLOW SYSTEM
========================= */

let following =
  localStorage.getItem("beshno_following") === "true";

let followers =
  parseInt(
    localStorage.getItem("beshno_followers") || "0"
  );


function updateFollowButton(){

  const btn =
    document.getElementById("followBtn");

  const count =
    document.getElementById("followerCount");


  if(following){

    btn.innerHTML = "✓ Following";

    btn.classList.add("following");

  }else{

    btn.innerHTML = "➕ Follow";

    btn.classList.remove("following");

  }


  count.innerHTML =
    followers + " followers";

}


function toggleFollow(){

  if(!following){

    following = true;

    followers++;

  }else{

    following = false;

    if(followers > 0){

      followers--;

    }

  }


  localStorage.setItem(
    "beshno_following",
    following
  );


  localStorage.setItem(
    "beshno_followers",
    followers
  );


  updateFollowButton();

}


updateFollowButton();


/* =========================
   LIKE
========================= */

function likePost(button){

  if(button.dataset.liked === "true"){

    button.innerHTML = "👍 Like";

    button.dataset.liked = "false";

  }else{

    button.innerHTML = "👍 Liked";

    button.dataset.liked = "true";

  }

}


/* =========================
   SHARE
========================= */

function sharePost(){

  if(navigator.share){

    navigator.share({

      title:"Beshno Blog",

      text:"Beshno Blog-এর এই পোস্টটি দেখুন",

      url:window.location.href

    });

  }else{

    navigator.clipboard.writeText(
      window.location.href
    );

    alert("Post link copied!");

  }

}

</script>

</body>
</html>
